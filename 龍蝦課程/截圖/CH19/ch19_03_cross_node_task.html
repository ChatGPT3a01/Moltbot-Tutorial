<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 對話模擬 - 跨節點任務</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', sans-serif;
  }
  .phone-frame {
    width: 400px;
    background: #7494C0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .status-bar {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 12px;
  }
  .status-bar .time { font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons span { font-size: 11px; }
  .line-header {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 12px 12px;
    gap: 12px;
  }
  .line-header .back-arrow { font-size: 22px; cursor: pointer; margin-right: 4px; }
  .line-header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .line-header .chat-name { font-size: 17px; font-weight: 600; flex: 1; }
  .line-header .header-icons { display: flex; gap: 16px; font-size: 18px; }
  .chat-area {
    background: #7494C0;
    padding: 12px 12px 20px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .date-divider {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin: 8px 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 4px;
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-row .avatar-small {
    width: 32px; height: 32px; border-radius: 50%;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    align-self: flex-start; margin-top: 2px;
  }
  .msg-row.user .avatar-small { display: none; }
  .bubble {
    max-width: 280px;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
    word-break: break-word;
  }
  .msg-row.bot .bubble {
    background: #fff;
    color: #333;
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: #5AC463;
    color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble b { font-weight: 700; }
  .timestamp {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  .screenshot-placeholder {
    background: #e0e0e0;
    border: 2px dashed #999;
    border-radius: 8px;
    padding: 24px 12px;
    text-align: center;
    color: #666;
    font-size: 13px;
    margin: 8px 0;
  }
  .screenshot-placeholder .icon {
    font-size: 32px;
    display: block;
    margin-bottom: 6px;
  }
  .input-bar {
    background: #E8E8E8;
    display: flex;
    align-items: center;
    padding: 8px 10px;
    gap: 8px;
  }
  .input-bar .input-field {
    flex: 1;
    background: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .input-bar .send-icons { display: flex; gap: 10px; font-size: 20px; color: #888; }
  .input-bar .mic-btn {
    width: 34px; height: 34px;
    background: #5AC463; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span class="time">上午 10:20</span>
    <div class="icons">
      <span>&#9679;&#9679;&#9679;&#9679;&#9675;</span>
      <span>&#128267;</span>
    </div>
  </div>

  <div class="line-header">
    <span class="back-arrow">&#10094;</span>
    <div class="avatar">&#129438;</div>
    <span class="chat-name">&#129438; 龍蝦 AI</span>
    <div class="header-icons">
      <span>&#9742;</span>
      <span>&#9776;</span>
    </div>
  </div>

  <div class="chat-area">
    <div class="date-divider">2026年3月7日（六）</div>

    <!-- User -->
    <div class="msg-row user">
      <div class="bubble">幫我看一下辦公室電腦桌面有什麼</div>
      <span class="timestamp">10:20</span>
    </div>

    <!-- Bot -->
    <div class="msg-row bot">
      <div class="avatar-small">&#129438;</div>
      <div class="bubble">
        &#128225; 正在分派任務到 worker-office...<br><br>
        &#9203; 連線中... &#8594; &#9989; 已連線<br>
        &#128248; 正在截取桌面...<br><br>
        <div class="screenshot-placeholder">
          <span class="icon">&#128187;</span>
          辦公室桌面截圖
        </div>
        桌面上有：<br>
        &#128193; 本週報告/（資料夾）<br>
        &#128193; 教學影片/（資料夾）<br>
        &#128196; 會議記錄_0307.docx<br>
        &#128196; 採購申請單.xlsx<br>
        &#128196; 期中考題庫.pdf<br><br>
        要我對這些檔案做什麼操作嗎？
      </div>
      <span class="timestamp">10:21</span>
    </div>
  </div>

  <div class="input-bar">
    <span style="font-size:22px;color:#888;">&#43;</span>
    <input class="input-field" placeholder="輸入訊息..." readonly>
    <div class="send-icons">
      <span>&#128522;</span>
    </div>
    <div class="mic-btn">&#127908;</div>
  </div>
</div>

</body>
</html>
