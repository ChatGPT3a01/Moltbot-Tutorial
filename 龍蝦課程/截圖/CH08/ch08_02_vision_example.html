<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 對話模擬 - 拍照辨識食材</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', sans-serif;
  }
  .phone-frame {
    width: 400px;
    background: #7494C0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .status-bar {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 12px;
  }
  .status-bar .time { font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons span { font-size: 11px; }
  .line-header {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 12px 12px;
    gap: 12px;
  }
  .line-header .back-arrow {
    font-size: 22px;
    cursor: pointer;
    margin-right: 4px;
  }
  .line-header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #FF6B35;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .line-header .chat-name {
    font-size: 17px;
    font-weight: 600;
    flex: 1;
  }
  .line-header .header-icons {
    display: flex;
    gap: 16px;
    font-size: 18px;
  }
  .chat-area {
    background: #7494C0;
    padding: 12px 12px 20px;
    min-height: 580px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .date-divider {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin: 8px 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 4px;
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-row .avatar-small {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #FF6B35;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 2px;
  }
  .msg-row.user .avatar-small { display: none; }
  .bubble {
    max-width: 270px;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
    word-break: break-word;
  }
  .msg-row.bot .bubble {
    background: #fff;
    color: #333;
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: #5AC463;
    color: #fff;
    border-top-right-radius: 4px;
  }
  .timestamp {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  /* Image placeholder (user photo) */
  .image-bubble {
    max-width: 220px;
    border-radius: 14px;
    overflow: hidden;
    background: #ddd;
    position: relative;
  }
  .image-placeholder {
    width: 220px;
    height: 170px;
    background: linear-gradient(135deg, #a8d8a0 0%, #e8d5a0 50%, #f0b0b0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 13px;
    text-align: center;
    gap: 6px;
  }
  .image-placeholder .food-icons {
    font-size: 36px;
    letter-spacing: 4px;
  }
  .image-placeholder .label {
    background: rgba(0,0,0,0.45);
    color: #fff;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
  }
  .bubble strong { font-weight: 700; }
  .input-bar {
    background: #E8E8E8;
    display: flex;
    align-items: center;
    padding: 8px 10px;
    gap: 8px;
  }
  .input-bar .input-field {
    flex: 1;
    background: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .input-bar .send-icons {
    display: flex;
    gap: 10px;
    font-size: 20px;
    color: #888;
  }
  .input-bar .mic-btn {
    width: 34px;
    height: 34px;
    background: #5AC463;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span class="time">下午 12:32</span>
    <div class="icons">
      <span>&#9679;&#9679;&#9679;&#9679;&#9675;</span>
      <span>&#128267;</span>
    </div>
  </div>

  <div class="line-header">
    <span class="back-arrow">&#10094;</span>
    <div class="avatar">&#129438;</div>
    <span class="chat-name">&#129438; 龍蝦 AI</span>
    <div class="header-icons">
      <span>&#9742;</span>
      <span>&#9776;</span>
    </div>
  </div>

  <div class="chat-area">
    <div class="date-divider">2026年3月7日（六）</div>

    <!-- User sends photo -->
    <div class="msg-row user">
      <div class="image-bubble">
        <div class="image-placeholder">
          <div class="food-icons">&#129370;&#127813;&#129473;&#129372;</div>
          <div class="label">&#128247; 用戶傳送的食材照片</div>
        </div>
      </div>
      <span class="timestamp">12:32</span>
    </div>

    <!-- User text -->
    <div class="msg-row user">
      <div class="bubble">幫我看看這些食材可以做什麼菜？</div>
      <span class="timestamp">12:32</span>
    </div>

    <!-- Bot reply -->
    <div class="msg-row bot">
      <div class="avatar-small">&#129438;</div>
      <div class="bubble">
        我看到你的冰箱有：&#129370; 雞蛋、&#127813; 番茄、&#129473; 洋蔥、&#129388; 青蔥<br><br>
        推薦你做：<br><br>
        &#127859; <strong>番茄炒蛋</strong>（最簡單！）<br>
        材料剛好夠，10 分鐘搞定<br><br>
        1. 番茄切塊、蛋打散<br>
        2. 先炒蛋盛起<br>
        3. 炒番茄加點糖<br>
        4. 倒入蛋拌炒<br>
        5. 撒蔥花，上桌！<br><br>
        要我教你其他做法嗎？
      </div>
      <span class="timestamp">12:33</span>
    </div>
  </div>

  <div class="input-bar">
    <span style="font-size:22px;color:#888;">&#43;</span>
    <input class="input-field" placeholder="輸入訊息..." readonly>
    <div class="send-icons">
      <span>&#128522;</span>
    </div>
    <div class="mic-btn">&#127908;</div>
  </div>
</div>

</body>
</html>
