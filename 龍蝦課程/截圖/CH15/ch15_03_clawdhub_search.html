<!DOCTYPE html>

<head>

<title>ch15_03_clawdhub_search</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  }
  .terminal-window {
    width: 1200px;
    border-radius: 8px;
    overflow: hidden;

  }
  .title-bar {
    background: #2d2d2d;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    user-select: none;
  }
  .title-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .terminal-icon {
    width: 16px;
    height: 16px;
    position: relative;
  }
  .terminal-icon::before {
    content: '';
    display: block;
    width: 14px;
    height: 14px;
    border: 2px solid #0078d4;
    border-radius: 2px;
    background: transparent;
  }
  .terminal-icon::after {
    content: '>';
    position: absolute;
    top: 1px;
    left: 4px;
    font-size: 10px;
    color: #0078d4;
    font-weight: bold;
  }
  .title-text {
    color: #cccccc;
    font-size: 12px;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
  }
  .tab-bar {
    background: #2d2d2d;
    height: 32px;
    display: flex;
    align-items: flex-end;
    padding: 0 8px;
    border-bottom: 1px solid #3d3d3d;
  }
  .tab {
    background: #1e1e1e;
    color: #cccccc;
    font-size: 12px;
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    padding: 6px 16px;
    border-radius: 6px 6px 0 0;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #3d3d3d;
    border-bottom: none;
    position: relative;
    top: 1px;
  }
  .tab-ps-icon {
    color: #0078d4;
    font-size: 10px;
    font-weight: bold;
  }
  .window-controls {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .window-controls .btn {
    width: 46px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 10px;
    cursor: default;
  }
  .btn-icon {
    font-family: 'Segoe MDL2 Assets', 'Arial', sans-serif;
    font-size: 10px;
  }
  .terminal-body {
    background: #0c0c0c;
    padding: 16px 20px;
    min-height: 200px;
  }
  .terminal-body pre {
    font-family: 'Cascadia Code', 'Consolas', 'Microsoft JhengHei', monospace;
    font-size: 15px;
    line-height: 1.6;
    color: #cccccc;
    white-space: pre;
  }
  .prompt { color: #3b78ff; }
  .command { color: #f9f1a5; }
  .output { color: #cccccc; }
  .green { color: #16c60c; }
  .cyan { color: #3a96dd; }
  .yellow { color: #f9f1a5; }
  .dim { color: #767676; }
  .white { color: #f2f2f2; }
  .emoji { font-family: 'Segoe UI Emoji', 'Microsoft JhengHei', sans-serif; }
  .pkg-name {
    color: #3a96dd;
    font-weight: bold;
  }
  .version { color: #767676; }
  .star { color: #f9f1a5; }
  .description { color: #cccccc; }
  .author { color: #767676; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 17px;
    background: #cccccc;
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media print {
    body { background: white; padding: 0; }
    .terminal-window { box-shadow: 1px 1px 4px rgba(0,0,0,0.3); }
    .cursor { display: none; }
