<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>ch20_05_voice_chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    font-family: 'Microsoft JhengHei', 'Segoe UI', sans-serif;
  }

  .container {
    width: 800px;
  }

  /* -- 上方標題 -- */
  .top-title {
    text-align: center;
    margin-bottom: 28px;
  }
  .top-title h1 {
    font-size: 22px;
    color: #1f2937;
    font-weight: 700;
  }
  .top-title p {
    font-size: 14px;
    color: #6b7280;
    margin-top: 6px;
  }

  /* -- 通話主視覺 -- */
  .call-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 36px 0 32px;
    background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
    border-radius: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    margin-bottom: 24px;
  }

  .caller-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .caller-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .caller-avatar.human {
    background: linear-gradient(135deg, #dbeafe, #bfdbfe);
    border: 3px solid #93c5fd;
  }
  .caller-avatar.lobster {
    background: linear-gradient(135deg, #fee2e2, #fecaca);
    border: 3px solid #fca5a5;
    animation: lobster-bounce 2s ease-in-out infinite;
  }
  @keyframes lobster-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .caller-name {
    font-size: 15px;
    font-weight: 600;
    color: #374151;
  }
  .caller-speech {
    font-size: 13px;
    color: #6b7280;
    background: #ffffff;
    padding: 6px 14px;
    border-radius: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    max-width: 180px;
    text-align: center;
    line-height: 1.5;
  }

  /* -- 聲波動畫 -- */
  .soundwave {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 8px;
  }
  .soundwave .bar {
    width: 4px;
    border-radius: 2px;
    background: linear-gradient(180deg, #818cf8, #6366f1);
    animation: wave 1.2s ease-in-out infinite;
  }
  .bar:nth-child(1) { height: 16px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 28px; animation-delay: 0.1s; }
  .bar:nth-child(3) { height: 40px; animation-delay: 0.2s; }
  .bar:nth-child(4) { height: 52px; animation-delay: 0.3s; }
  .bar:nth-child(5) { height: 40px; animation-delay: 0.4s; }
  .bar:nth-child(6) { height: 28px; animation-delay: 0.5s; }
  .bar:nth-child(7) { height: 16px; animation-delay: 0.6s; }
  .bar:nth-child(8) { height: 28px; animation-delay: 0.7s; }
  .bar:nth-child(9) { height: 40px; animation-delay: 0.8s; }
  .bar:nth-child(10) { height: 52px; animation-delay: 0.9s; }
  .bar:nth-child(11) { height: 40px; animation-delay: 1.0s; }
  .bar:nth-child(12) { height: 28px; animation-delay: 1.1s; }
  .bar:nth-child(13) { height: 16px; animation-delay: 0.15s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .wave-label {
    font-size: 12px;
    color: #818cf8;
    text-align: center;
    margin-top: 6px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* -- 對話泡泡區 -- */
  .chat-section {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px 28px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .chat-section-title {
    font-size: 14px;
    color: #9ca3af;
    margin-bottom: 18px;
    text-align: center;
    font-weight: 500;
    letter-spacing: 1px;
  }

  .chat-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }
  .chat-row:last-child { margin-bottom: 0; }

  .chat-row.right {
    flex-direction: row-reverse;
  }

  .chat-avatar-sm {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .chat-avatar-sm.human-sm {
    background: #dbeafe;
  }
  .chat-avatar-sm.lobster-sm {
    background: #fee2e2;
  }

  .chat-bubble {
    max-width: 60%;
    padding: 11px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #1f2937;
  }
  .chat-bubble.user-bubble {
    background: #dbeafe;
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.bot-bubble {
    background: #f3f4f6;
    border-bottom-left-radius: 4px;
  }
  .chat-bubble .speaker {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .chat-bubble .speaker.user-label { color: #3b82f6; }
  .chat-bubble .speaker.bot-label { color: #e63946; }

  /* -- 底部狀態 -- */
  .call-status {
    text-align: center;
    margin-top: 20px;
    padding: 10px;
    font-size: 13px;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .call-status .recording-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    animation: rec-blink 1.5s ease-in-out infinite;
  }
  @keyframes rec-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @media print {
    body { background: white; padding: 0; }
    .call-visual { box-shadow: none; border: 1px solid #e5e7eb; }
    .chat-section { box-shadow: none; border: 1px solid #e5e7eb; }
    .soundwave .bar { animation: none; transform: scaleY(1); opacity: 1; }
    .lobster-avatar { animation: none; }
    .call-status .recording-dot { animation: none; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- 標題 -->
  <div class="top-title">
    <h1>&#x1F3A4; 語音通話 &mdash; 跟龍蝦講電話</h1>
    <p>用說的就能跟 AI 助理對話，就像打電話一樣自然</p>
  </div>

  <!-- 通話主視覺 -->
  <div class="call-visual">
    <!-- 左邊：你 -->
    <div class="caller-box">
      <div class="caller-avatar human">&#x1F4F1;</div>
      <div class="caller-name">你</div>
      <div class="caller-speech">「喂，龍蝦你好」</div>
    </div>

    <!-- 中間：聲波 -->
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div class="soundwave">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="wave-label">&#x1F50A; 通話中</div>
    </div>

    <!-- 右邊：龍蝦 -->
    <div class="caller-box">
      <div class="caller-avatar lobster">&#x1F99E;</div>
      <div class="caller-name">龍蝦</div>
      <div class="caller-speech">「你好！有什麼我可以幫你的嗎？」</div>
    </div>
  </div>

  <!-- 對話記錄 -->
  <div class="chat-section">
    <div class="chat-section-title">&#x1F4DD; 語音對話記錄</div>

    <!-- 你 -->
    <div class="chat-row right">
      <div class="chat-avatar-sm human-sm">&#x1F464;</div>
      <div class="chat-bubble user-bubble">
        <div class="speaker user-label">你</div>
        幫我查明天台北天氣
      </div>
    </div>

    <!-- 龍蝦 -->
    <div class="chat-row">
      <div class="chat-avatar-sm lobster-sm">&#x1F99E;</div>
      <div class="chat-bubble bot-bubble">
        <div class="speaker bot-label">龍蝦</div>
        明天台北 24 到 28 度，午後有陣雨，建議帶傘
      </div>
    </div>

    <!-- 你 -->
    <div class="chat-row right">
      <div class="chat-avatar-sm human-sm">&#x1F464;</div>
      <div class="chat-bubble user-bubble">
        <div class="speaker user-label">你</div>
        好的謝謝
      </div>
    </div>

    <!-- 龍蝦 -->
    <div class="chat-row">
      <div class="chat-avatar-sm lobster-sm">&#x1F99E;</div>
      <div class="chat-bubble bot-bubble">
        <div class="speaker bot-label">龍蝦</div>
        不客氣，還有其他需要嗎？
      </div>
    </div>
  </div>

  <!-- 通話狀態 -->
  <div class="call-status">
    <span class="recording-dot"></span>
    語音辨識：即時轉文字中 &middot; 通話時間 01:23
  </div>
</div>
</body>
</html>
