<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 對話模擬 - 瀏覽器操控查詢</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 20px 0;
    font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', sans-serif;
  }
  .phone-frame {
    width: 400px;
    background: #7494C0;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .status-bar {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    font-size: 12px;
  }
  .status-bar .time { font-weight: 600; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar .icons span { font-size: 11px; }
  .line-header {
    background: #4A6E8A;
    color: #fff;
    display: flex;
    align-items: center;
    padding: 10px 12px 12px;
    gap: 12px;
  }
  .line-header .back-arrow { font-size: 22px; cursor: pointer; margin-right: 4px; }
  .line-header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .line-header .chat-name { font-size: 17px; font-weight: 600; flex: 1; }
  .line-header .header-icons { display: flex; gap: 16px; font-size: 18px; }
  .chat-area {
    background: #7494C0;
    padding: 12px 12px 20px;
    min-height: 520px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .date-divider {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    margin: 8px 0;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 4px;
  }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-row .avatar-small {
    width: 32px; height: 32px; border-radius: 50%;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    align-self: flex-start; margin-top: 2px;
  }
  .msg-row.user .avatar-small { display: none; }
  .bubble {
    max-width: 290px;
    padding: 10px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    position: relative;
    word-break: break-word;
  }
  .msg-row.bot .bubble {
    background: #fff;
    color: #333;
    border-top-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: #5AC463;
    color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble b { font-weight: 700; }
  .timestamp {
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  /* 表格樣式 */
  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0;
    font-size: 12px;
  }
  .bubble table th {
    background: #f0f4f8;
    color: #475569;
    font-weight: 700;
    padding: 4px 6px;
    border-bottom: 2px solid #cbd5e1;
    text-align: left;
  }
  .bubble table td {
    padding: 3px 6px;
    border-bottom: 1px solid #e2e8f0;
    color: #334155;
  }
  .bubble table tr:last-child td {
    border-bottom: none;
  }
  .input-bar {
    background: #E8E8E8;
    display: flex;
    align-items: center;
    padding: 8px 10px;
    gap: 8px;
  }
  .input-bar .input-field {
    flex: 1;
    background: #fff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .input-bar .send-icons { display: flex; gap: 10px; font-size: 20px; color: #888; }
  .input-bar .mic-btn {
    width: 34px; height: 34px;
    background: #5AC463; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span class="time">下午 03:45</span>
    <div class="icons">
      <span>&#9679;&#9679;&#9679;&#9679;&#9675;</span>
      <span>&#128267;</span>
    </div>
  </div>

  <div class="line-header">
    <span class="back-arrow">&#10094;</span>
    <div class="avatar">&#129438;</div>
    <span class="chat-name">&#129438; 龍蝦 AI</span>
    <div class="header-icons">
      <span>&#9742;</span>
      <span>&#9776;</span>
    </div>
  </div>

  <div class="chat-area">
    <div class="date-divider">2026年3月7日（六）</div>

    <!-- User -->
    <div class="msg-row user">
      <div class="bubble">幫我上網查台北到高雄的高鐵時刻</div>
      <span class="timestamp">15:45</span>
    </div>

    <!-- Bot -->
    <div class="msg-row bot">
      <div class="avatar-small">&#129438;</div>
      <div class="bubble">
        &#127760; 好的，我來查一下...<br><br>
        &#128644; <b>台北 → 高雄 高鐵時刻</b>（今日 3/7）<br>
        <table>
          <tr>
            <th>車次</th>
            <th>出發</th>
            <th>抵達</th>
            <th>行車時間</th>
          </tr>
          <tr>
            <td>803</td>
            <td>09:06</td>
            <td>10:42</td>
            <td>1h36m</td>
          </tr>
          <tr>
            <td>115</td>
            <td>09:21</td>
            <td>11:14</td>
            <td>1h53m</td>
          </tr>
          <tr>
            <td>805</td>
            <td>09:36</td>
            <td>11:12</td>
            <td>1h36m</td>
          </tr>
          <tr>
            <td>133</td>
            <td>10:06</td>
            <td>11:59</td>
            <td>1h53m</td>
          </tr>
        </table>
        <br>
        &#128161; 803 和 805 是直達車，比較快！要我幫你訂票嗎？
      </div>
      <span class="timestamp">15:46</span>
    </div>
  </div>

  <div class="input-bar">
    <span style="font-size:22px;color:#888;">&#43;</span>
    <input class="input-field" placeholder="輸入訊息..." readonly>
    <div class="send-icons">
      <span>&#128522;</span>
    </div>
    <div class="mic-btn">&#127908;</div>
  </div>
</div>

</body>
</html>
